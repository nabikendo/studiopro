name: Gerar APK Studio Pro S24 FE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Processar Fundo Transparente e Ícone Sea Glass
        run: |
          pip install pillow pillow-avif-plugin
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          python3 - << 'PYEOF'
          import os, glob, random, math
          from PIL import Image, ImageDraw, ImageFilter

          size = 512
          canvas = Image.new("RGBA", (size, size), (246, 238, 228, 255))
          shadow = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          sdraw = ImageDraw.Draw(shadow)
          sdraw.rounded_rectangle([78, 96, 452, 464], radius=118, fill=(182, 118, 232, 135))
          shadow = shadow.filter(ImageFilter.GaussianBlur(24))
          canvas.alpha_composite(shadow)

          glass = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          gpx = glass.load()
          random.seed(42)
          for y in range(52, 436):
              u = (y - 52) / 384.0
              for x in range(52, 436):
                  t = (x - 52) / 384.0
                  r = int(242 * (1 - t * 0.45) + 180 * (t * 0.45))
                  g = int(188 * (1 - u * 0.5) + 228 * (u * 0.5))
                  b = int(252)
                  highlight = max(0.0, 1.0 - math.hypot(t - 0.22, u - 0.22) * 1.35)
                  r = min(255, int(r + highlight * 28))
                  g = min(255, int(g + highlight * 28))
                  b = min(255, int(b + highlight * 15))
                  grain = random.randint(-9, 9)
                  r = max(0, min(255, r + grain))
                  g = max(0, min(255, g + grain))
                  b = max(0, min(255, b + grain))
                  gpx[x, y] = (r, g, b, 248)

          mask = Image.new("L", (size, size), 0)
          mdraw = ImageDraw.Draw(mask)
          mdraw.rounded_rectangle([52, 52, 436, 436], radius=116, fill=255)

          frosted_piece = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          frosted_piece.paste(glass, (0, 0), mask)

          bdraw = ImageDraw.Draw(frosted_piece)
          bdraw.rounded_rectangle([54, 54, 434, 434], radius=114, outline=(255, 255, 255, 235), width=8)

          ink = (74, 29, 118, 245)
          bdraw.arc([148, 134, 340, 326], start=180, end=360, fill=ink, width=24)
          bdraw.rounded_rectangle([134, 224, 188, 340], radius=27, fill=ink)
          bdraw.rounded_rectangle([300, 224, 354, 340], radius=27, fill=ink)

          canvas.alpha_composite(frosted_piece)
          canvas.save("app/src/main/res/drawable/ic_launcher.png")
          for folder, px_size in [
              ("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96),
              ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192),
          ]:
              resized = canvas.resize((px_size, px_size), Image.Resampling.LANCZOS)
              resized.save(f"app/src/main/res/{folder}/ic_launcher.png")
              resized.save(f"app/src/main/res/{folder}/ic_launcher_round.png")

          candidates = []
          for ext in ("*.png", "*.jpg", "*.jpeg", "*.webp", "*.avif"):
              candidates.extend(glob.glob(ext))
          candidates = [c for c in candidates if "ic_launcher" not in c]
          ugreen_imgs = [c for c in candidates if "ugreen" in c.lower() or "1466" in c.lower() or "fone" in c.lower()]
          chosen = ugreen_imgs[0] if ugreen_imgs else (candidates[0] if candidates else None)

          if chosen:
              try:
                  im = Image.open(chosen).convert("RGBA")
                  im.thumbnail((700, 700), Image.Resampling.LANCZOS)
                  w, h = im.size
                  px = im.load()
                  for start_x, start_y in [(0, 0), (w-1, 0), (0, h-1), (w-1, h-1)]:
                      r_bg, g_bg, b_bg, _ = px[start_x, start_y]
                      is_white = (r_bg > 190 and g_bg > 190 and b_bg > 190)
                      is_gray = (abs(r_bg - g_bg) < 15 and abs(g_bg - b_bg) < 15 and r_bg > 100)
                      is_black = (r_bg < 50 and g_bg < 50 and b_bg < 50)
                      if is_white or is_gray or is_black:
                          visited = set()
                          stack = [(start_x, start_y)]
                          while stack:
                              x, y = stack.pop()
                              if (x, y) in visited: continue
                              if x < 0 or x >= w or y < 0 or y >= h: continue
                              visited.add((x, y))
                              r, g, b, a = px[x, y]
                              lum = 0.299 * r + 0.587 * g + 0.114 * b
                              match_bg = (lum > 200) if is_white else ((abs(r-g)<15 and r>100) or lum < 55)
                              if match_bg:
                                  px[x, y] = (r, g, b, 0)
                                  stack.extend([(x+1, y), (x-1, y), (x, y+1), (x, y-1)])
                  im.save("app/src/main/assets/ugreen_cutout.png")
              except Exception as e:
                  print("Erro processando imagem:", e)
          PYEOF

      - name: Compilar APK Final
        run: |
          mkdir -p app/src/main/java/com/anderson/studiopro
          mkdir -p app/src/main/res/values

          cp studiopro.html app/src/main/assets/index.html

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "StudioProS24"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.anderson.studiopro"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.anderson.studiopro"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 9
                  versionName = "9.0-Refined"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.OverlayPopup" parent="@android:style/Theme.Translucent.NoTitleBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:backgroundDimEnabled">true</item>
                  <item name="android:backgroundDimAmount">0.45</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:label="Studio Pro"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:theme="@style/Theme.OverlayPopup"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".StudioProTileService"
                      android:label="Studio Pro"
                      android:icon="@mipmap/ic_launcher"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>

                  <receiver android:name=".StudioProReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.bluetooth.device.action.ACL_CONNECTED" />
                          <action android:name="android.bluetooth.device.action.BATTERY_LEVEL_CHANGED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/anderson/studiopro/StudioProTileService.kt
          package com.anderson.studiopro

          import android.content.Intent
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          class StudioProTileService : TileService() {
              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply { state = Tile.STATE_ACTIVE; label = "Studio Pro"; updateTile() }
              }
              override fun onClick() {
                  super.onClick()
                  val intent = Intent(this, MainActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                  }
                  startActivityAndCollapse(intent)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/anderson/studiopro/MainActivity.kt
          package com.anderson.studiopro

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothProfile
          import android.bluetooth.BluetoothSocket
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import java.util.UUID

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var activeDevice: BluetoothDevice? = null
              private var rfcommSocket: BluetoothSocket? = null
              private var foundDuringScan: Boolean = false
              private val sppUuid: UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")

              private val btReceiver = object : BroadcastReceiver() {
                  @SuppressLint("MissingPermission")
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          BluetoothDevice.ACTION_FOUND -> {
                              val device: BluetoothDevice? = intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                              val name = device?.name ?: return
                              if (isTargetDevice(name)) {
                                  foundDuringScan = true
                                  activeDevice = device
                                  BluetoothAdapter.getDefaultAdapter()?.cancelDiscovery()
                                  if (device.bondState == BluetoothDevice.BOND_NONE) {
                                      pushStatusToWeb("Pareando com $name...", false)
                                      device.createBond()
                                  } else {
                                      connectAudioAndControl(device)
                                  }
                              }
                          }
                          BluetoothDevice.ACTION_BOND_STATE_CHANGED -> {
                              val device: BluetoothDevice? = intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                              val state = intent.getIntExtra(BluetoothDevice.EXTRA_BOND_STATE, BluetoothDevice.BOND_NONE)
                              if (device != null && isTargetDevice(device.name ?: "")) {
                                  if (state == BluetoothDevice.BOND_BONDED) {
                                      activeDevice = device
                                      connectAudioAndControl(device)
                                  }
                              }
                          }
                          BluetoothDevice.ACTION_ACL_CONNECTED -> {
                              val device: BluetoothDevice? = intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                              val name = device?.name ?: return
                              if (isTargetDevice(name)) {
                                  activeDevice = device
                                  pushToWeb(name, getDeviceBattery(device), true)
                              }
                          }
                          "android.bluetooth.device.action.BATTERY_LEVEL_CHANGED" -> {
                              val level = intent.getIntExtra("android.bluetooth.device.extra.BATTERY_LEVEL", -1)
                              if (level in 0..100) pushToWeb(null, level, true)
                          }
                          BluetoothDevice.ACTION_ACL_DISCONNECTED -> {
                              closeRfcomm()
                              finish()
                          }
                      }
                  }
              }

              private fun isTargetDevice(name: String): Boolean {
                  return name.contains("Studio Pro", ignoreCase = true) || name.contains("UGREEN", ignoreCase = true)
              }

              @SuppressLint("MissingPermission")
              private fun getDeviceBattery(device: BluetoothDevice?): Int {
                  val target = device ?: activeDevice ?: return 100
                  val b = try {
                      target.javaClass.getMethod("getBatteryLevel").invoke(target) as? Int ?: 100
                  } catch (e: Exception) { 100 }
                  return if (b in 0..100) b else 100
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestAllPermissionsEarly()

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.TRANSPARENT)
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.allowFileAccess = true
                      addJavascriptInterface(AndroidBridge(), "AndroidBridge")
                      webViewClient = object : WebViewClient() {
                          override fun onPageFinished(view: WebView?, url: String?) {
                              syncBluetoothState()
                          }
                      }
                      loadUrl("file:///android_asset/index.html")
                  }
                  setContentView(webView)

                  val filter = IntentFilter().apply {
                      addAction(BluetoothDevice.ACTION_FOUND)
                      addAction(BluetoothDevice.ACTION_BOND_STATE_CHANGED)
                      addAction(BluetoothDevice.ACTION_ACL_CONNECTED)
                      addAction(BluetoothDevice.ACTION_ACL_DISCONNECTED)
                      addAction(BluetoothAdapter.ACTION_DISCOVERY_FINISHED)
                      addAction("android.bluetooth.device.action.BATTERY_LEVEL_CHANGED")
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(btReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(btReceiver, filter)
                  }
              }

              private fun requestAllPermissionsEarly() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      val perms = mutableListOf<String>()
                      if (checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) perms.add(Manifest.permission.BLUETOOTH_CONNECT)
                      if (checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN) != PackageManager.PERMISSION_GRANTED) perms.add(Manifest.permission.BLUETOOTH_SCAN)
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) perms.add(Manifest.permission.ACCESS_FINE_LOCATION)
                      if (perms.isNotEmpty()) requestPermissions(perms.toTypedArray(), 100)
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      startActivity(intent)
                  }
              }

              @SuppressLint("MissingPermission")
              private fun syncBluetoothState() {
                  try {
                      val adapter = BluetoothAdapter.getDefaultAdapter() ?: return
                      for (device in adapter.bondedDevices) {
                          val name = device.name ?: continue
                          if (isTargetDevice(name)) {
                              val isConn = try { device.javaClass.getMethod("isConnected").invoke(device) as? Boolean ?: false } catch (e: Exception) { false }
                              if (isConn) {
                                  activeDevice = device
                                  pushToWeb(name, getDeviceBattery(device), true)
                                  return
                              }
                          }
                      }
                  } catch (e: Exception) {}
              }

              @SuppressLint("MissingPermission")
              private fun initiatePairingOrConnect() {
                  val adapter = BluetoothAdapter.getDefaultAdapter() ?: return
                  if (!adapter.isEnabled) {
                      startActivity(Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE))
                      return
                  }
                  for (device in adapter.bondedDevices) {
                      if (isTargetDevice(device.name ?: "")) {
                          activeDevice = device
                          val isConn = try { device.javaClass.getMethod("isConnected").invoke(device) as? Boolean ?: false } catch (e: Exception) { false }
                          if (isConn) pushToWeb(device.name, getDeviceBattery(device), true)
                          else connectAudioAndControl(device)
                          return
                      }
                  }
                  foundDuringScan = false
                  if (adapter.isDiscovering) adapter.cancelDiscovery()
                  adapter.startDiscovery()
                  pushStatusToWeb("Procurando fone...", false)
              }

              @SuppressLint("MissingPermission")
              private fun connectAudioAndControl(device: BluetoothDevice) {
                  BluetoothAdapter.getDefaultAdapter()?.getProfileProxy(this, object : BluetoothProfile.ServiceListener {
                      override fun onServiceConnected(profile: Int, proxy: BluetoothProfile) {
                          try { proxy.javaClass.getMethod("connect", BluetoothDevice::class.java).invoke(proxy, device) } catch (e: Exception) {}
                          BluetoothAdapter.getDefaultAdapter()?.closeProfileProxy(profile, proxy)
                      }
                      override fun onServiceDisconnected(profile: Int) {}
                  }, BluetoothProfile.A2DP)

                  Thread {
                      try {
                          Thread.sleep(1000L)
                          val sock = devSocket(device)
                          rfcommSocket = sock
                          pushToWeb(device.name ?: "UGREEN Studio Pro", getDeviceBattery(device), true)
                      } catch (e: Exception) {
                          pushStatusToWeb("Erro ao conectar.", true)
                      }
                  }.start()
              }

              @SuppressLint("MissingPermission")
              private fun devSocket(dev: BluetoothDevice): BluetoothSocket {
                  return try {
                      dev.createInsecureRfcommSocketToServiceRecord(sppUuid).apply { connect() }
                  } catch (e1: Exception) {
                      val m = dev.javaClass.getMethod("createRfcommSocket", Int::class.java)
                      (m.invoke(dev, Integer.valueOf(1)) as BluetoothSocket).apply { connect() }
                  }
              }

              private fun hexToBytes(hex: String): ByteArray {
                  val clean = hex.replace(" ", "")
                  val data = ByteArray(clean.length / 2)
                  var i = 0
                  while (i < clean.length) {
                      data[i / 2] = clean.substring(i, i + 2).toInt(16).toByte()
                      i += 2
                  }
                  return data
              }

              @SuppressLint("MissingPermission")
              private fun sendUgreenCommand(hexCmd: String) {
                  Thread {
                      try {
                          if (activeDevice == null) syncBluetoothState()
                          val dev = activeDevice ?: return@Thread
                          var sock = rfcommSocket
                          if (sock == null || !sock.isConnected) {
                              val newSock = devSocket(dev)
                              rfcommSocket = newSock
                              sock = newSock
                              newSock.outputStream.write(hexToBytes("AA BB CC 04 01 00 31 91"))
                              newSock.outputStream.flush()
                              Thread.sleep(50L)
                              newSock.outputStream.write(hexToBytes("AA BB CC 01 01 00 21 90"))
                              newSock.outputStream.flush()
                              Thread.sleep(50L)
                          }
                          sock?.outputStream?.write(hexToBytes(hexCmd))
                          sock?.outputStream?.flush()
                      } catch (e: Exception) { closeRfcomm() }
                  }.start()
              }

              private fun closeRfcomm() {
                  try { rfcommSocket?.close() } catch (e: Exception) {}
                  rfcommSocket = null
              }

              private fun pushToWeb(name: String?, battery: Int, connected: Boolean) {
                  val safeName = name?.let { "'$it'" } ?: "null"
                  webView.post { webView.evaluateJavascript("if(window.updateFromAndroid) window.updateFromAndroid($safeName, $battery, $connected);", null) }
              }

              private fun pushStatusToWeb(msg: String, resetBtn: Boolean) {
                  val safeMsg = msg.replace("'", "\\'")
                  webView.post { webView.evaluateJavascript("if(window.updateSearchStatus) window.updateSearchStatus('$safeMsg', $resetBtn);", null) }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  closeRfcomm()
                  try { unregisterReceiver(btReceiver) } catch (e: Exception) {}
              }

              inner class AndroidBridge {
                  @JavascriptInterface
                  fun closeOverlay() { runOnUiThread { closeRfcomm(); finish() } }

                  @JavascriptInterface
                  fun vibrateTick() {
                      try {
                          val vib = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              vib?.vibrate(VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK))
                          } else {
                              vib?.vibrate(VibrationEffect.createOneShot(12, VibrationEffect.DEFAULT_AMPLITUDE))
                          }
                      } catch (e: Exception) {}
                  }

                  @JavascriptInterface
                  fun requestBatteryUpdate(): Int {
                      syncBluetoothState()
                      return getDeviceBattery(activeDevice)
                  }

                  @JavascriptInterface
                  fun startPairingOrConnect() { runOnUiThread { initiatePairingOrConnect() } }

                  @JavascriptInterface
                  fun switchAudioDevice() {
                      runOnUiThread {
                          try {
                              val adapter = BluetoothAdapter.getDefaultAdapter() ?: return@runOnUiThread
                              val bonded = adapter.bondedDevices.filter { isTargetDevice(it.name ?: "") }
                              val nextDev = bonded.firstOrNull { it.address != activeDevice?.address } ?: bonded.firstOrNull()
                              if (nextDev != null) { activeDevice = nextDev; connectAudioAndControl(nextDev) }
                              else startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS))
                          } catch (e: Exception) {}
                      }
                  }

                  @JavascriptInterface
                  fun setAncMode(mode: String) {
                      when (mode) {
                          "anc" -> sendUgreenCommand("AA BB CC 09 01 A1 61 EA")
                          "off" -> sendUgreenCommand("AA BB CC 09 01 A0 A0 2A")
                          "transparency" -> sendUgreenCommand("AA BB CC 09 01 A2 21 EB")
                      }
                  }

                  @JavascriptInterface
                  fun setUgreenExtra(feature: String, value: String) {}
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/anderson/studiopro/StudioProReceiver.kt
          package com.anderson.studiopro

          import android.annotation.SuppressLint
          import android.bluetooth.BluetoothDevice
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class StudioProReceiver : BroadcastReceiver() {
              @SuppressLint("MissingPermission")
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action != BluetoothDevice.ACTION_ACL_CONNECTED) return
                  val device: BluetoothDevice? = intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                  val name = device?.name ?: return
                  if (name.contains("Studio Pro", ignoreCase = true) || name.contains("UGREEN", ignoreCase = true)) {
                      val popupIntent = Intent(context, MainActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      }
                      context.startActivity(popupIntent)
                  }
              }
          }
          EOF

      - name: Compilar APK Final
        run: gradle assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: StudioPro-S24FE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
