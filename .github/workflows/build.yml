name: Gerar APK Studio Pro S24 FE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar Ícone Sea Glass e Recortar Foto do Fone
        run: |
          pip install pillow pillow-avif-plugin
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          python3 - << 'PYEOF'
          import os, glob, random, math
          from PIL import Image, ImageDraw, ImageFilter
          try:
              import pillow_avif
          except Exception:
              pass

          # 1. CRIA O ÍCONE "SEA GLASS" FIEL AO VÍDEO DE REFERÊNCIA
          size = 512
          # Base areia/creme suave do tema Sea Glass para Adaptive Icon da Samsung
          canvas = Image.new("RGBA", (size, size), (246, 238, 228, 255))

          # Sombra difusa colorida (lilás/rosa translúcido projetado à direita/baixo)
          shadow = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          sdraw = ImageDraw.Draw(shadow)
          sdraw.rounded_rectangle([78, 96, 452, 464], radius=118, fill=(182, 118, 232, 135))
          shadow = shadow.filter(ImageFilter.GaussianBlur(24))
          canvas.alpha_composite(shadow)

          # Peça de vidro marinho fosco (gradiente Rosa-Lilás -> Azul-Celeste -> Verde-Água)
          glass = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          gpx = glass.load()
          random.seed(42)
          for y in range(52, 436):
              u = (y - 52) / 384.0
              for x in range(52, 436):
                  t = (x - 52) / 384.0
                  # Mistura suave das cores Sea Glass do vídeo
                  r = int(242 * (1 - t * 0.45) + 180 * (t * 0.45))
                  g = int(188 * (1 - u * 0.5) + 228 * (u * 0.5))
                  b = int(252)
                  # Luz interna mais clara no canto superior esquerdo
                  highlight = max(0.0, 1.0 - math.hypot(t - 0.22, u - 0.22) * 1.35)
                  r = min(255, int(r + highlight * 28))
                  g = min(255, int(g + highlight * 28))
                  b = min(255, int(b + highlight * 15))
                  # Textura granulada característica do Sea Glass (Frosted Sea Glass Grain)
                  grain = random.randint(-9, 9)
                  r = max(0, min(255, r + grain))
                  g = max(0, min(255, g + grain))
                  b = max(0, min(255, b + grain))
                  gpx[x, y] = (r, g, b, 248)

          mask = Image.new("L", (size, size), 0)
          mdraw = ImageDraw.Draw(mask)
          mdraw.rounded_rectangle([52, 52, 436, 436], radius=116, fill=255)

          frosted_piece = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          frosted_piece.paste(glass, (0, 0), mask)

          # Borda interna branca brilhante de refração de vidro
          bdraw = ImageDraw.Draw(frosted_piece)
          bdraw.rounded_rectangle([54, 54, 434, 434], radius=114, outline=(255, 255, 255, 235), width=8)
          bdraw.rounded_rectangle([59, 59, 429, 429], radius=110, outline=(255, 255, 255, 110), width=3)

          # Glifo minimalista do Auscultador no mesmo tom Roxo/Índigo profundo do vídeo Sea Glass
          ink = (74, 29, 118, 245)
          # Arco superior
          bdraw.arc([148, 134, 340, 326], start=180, end=360, fill=ink, width=24)
          # Almofadas esquerda e direita em formato cápsula
          bdraw.rounded_rectangle([134, 224, 188, 340], radius=27, fill=ink)
          bdraw.rounded_rectangle([300, 224, 354, 340], radius=27, fill=ink)
          # Brilho interno nas conchas
          bdraw.rounded_rectangle([150, 248, 164, 316], radius=7, fill=(248, 232, 255, 215))
          bdraw.rounded_rectangle([324, 248, 338, 316], radius=7, fill=(248, 232, 255, 215))

          canvas.alpha_composite(frosted_piece)

          # Guarda em todas as resoluções do Android / Samsung One UI
          canvas.save("app/src/main/res/drawable/ic_launcher.png")
          for folder, px_size in [
              ("mipmap-mdpi", 48),
              ("mipmap-hdpi", 72),
              ("mipmap-xhdpi", 96),
              ("mipmap-xxhdpi", 144),
              ("mipmap-xxxhdpi", 192),
          ]:
              resized = canvas.resize((px_size, px_size), Image.Resampling.LANCZOS)
              resized.save(f"app/src/main/res/{folder}/ic_launcher.png")
              resized.save(f"app/src/main/res/{folder}/ic_launcher_round.png")

          # 2. RECORTE AUTOMÁTICO DA FOTO DO FONE ENVIADA PARA O REPOSITÓRIO
          candidates = []
          for ext in ("*.png", "*.jpg", "*.jpeg", "*.webp", "*.avif"):
              candidates.extend(glob.glob(ext))
          candidates = [c for c in candidates if "ic_launcher" not in c]
          ugreen_imgs = [c for c in candidates if "ugreen" in c.lower() or "1466" in c.lower() or "fone" in c.lower()]
          chosen = ugreen_imgs[0] if ugreen_imgs else (candidates[0] if candidates else None)

          if chosen:
              try:
                  im = Image.open(chosen).convert("RGBA")
                  im.thumbnail((600, 600), Image.Resampling.LANCZOS)
                  w, h = im.size
                  px = im.load()
                  r0, g0, b0, a0 = px[0, 0]
                  if a0 > 200:
                      is_white = (r0 > 215 and g0 > 215 and b0 > 215)
                      is_black = (r0 < 40 and g0 < 40 and b0 < 40)
                      if is_white or is_black:
                          visited = set()
                          stack = [(0, 0), (w - 1, 0), (0, h - 1), (w - 1, h - 1)]
                          while stack:
                              x, y = stack.pop()
                              if (x, y) in visited:
                                  continue
                              visited.add((x, y))
                              r, g, b, a = px[x, y]
                              lum = 0.299 * r + 0.587 * g + 0.114 * b
                              bg = (lum > 230) if is_white else (lum < 28)
                              if bg:
                                  px[x, y] = (r, g, b, 0)
                                  if x > 0: stack.append((x - 1, y))
                                  if x < w - 1: stack.append((x + 1, y))
                                  if y > 0: stack.append((x, y - 1))
                                  if y < h - 1: stack.append((x, y + 1))
                              elif is_white and lum > 205:
                                  px[x, y] = (r, g, b, int(((230 - lum) / 25.0) * 255))
                              elif is_black and lum < 45:
                                  px[x, y] = (r, g, b, int(((lum - 28) / 17.0) * 255))
                  im.save("app/src/main/assets/ugreen_cutout.png")
              except Exception as e:
                  print("Erro ao processar imagem:", e)
          PYEOF

      - name: Montar estrutura nativa Android com Controlo ANC Real
        run: |
          mkdir -p app/src/main/java/com/anderson/studiopro
          mkdir -p app/src/main/res/values

          cp studiopro.html app/src/main/assets/index.html

          cat << 'EOF' >> app/src/main/assets/index.html
          <script>
            const origClose = window.closePopup;
            window.closePopup = function() {
              if (origClose) origClose();
              if (window.AndroidBridge) window.AndroidBridge.closeOverlay();
            };

            const origSetMode = window.setListeningMode;
            window.setListeningMode = function(mode) {
              if (origSetMode) origSetMode(mode);
              if (window.AndroidBridge && window.AndroidBridge.setAncMode) {
                window.AndroidBridge.setAncMode(mode);
              }
            };
          </script>
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "StudioProS24"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.anderson.studiopro"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.anderson.studiopro"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0-SeaGlass"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.OverlayPopup" parent="@android:style/Theme.Translucent.NoTitleBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:backgroundDimEnabled">true</item>
                  <item name="android:backgroundDimAmount">0.45</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:label="Studio Pro"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:theme="@style/Theme.OverlayPopup"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".StudioProReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.bluetooth.device.action.ACL_CONNECTED" />
                          <action android:name="android.bluetooth.device.action.BATTERY_LEVEL_CHANGED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/anderson/studiopro/MainActivity.kt
          package com.anderson.studiopro

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothSocket
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import java.io.File
          import java.util.UUID

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null
              private var activeDevice: BluetoothDevice? = null
              private var rfcommSocket: BluetoothSocket? = null
              private val sppUuid: UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")

              private val btReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          "android.bluetooth.device.action.BATTERY_LEVEL_CHANGED" -> {
                              val level = intent.getIntExtra("android.bluetooth.device.extra.BATTERY_LEVEL", -1)
                              if (level in 0..100) pushToWeb(null, level, true)
                          }
                          BluetoothDevice.ACTION_ACL_DISCONNECTED -> {
                              closeRfcomm()
                              finish()
                          }
                      }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  requestNeededPermissions()

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.TRANSPARENT)
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.allowFileAccess = true
                      addJavascriptInterface(AndroidBridge(), "AndroidBridge")

                      webViewClient = object : WebViewClient() {
                          override fun onPageFinished(view: WebView?, url: String?) {
                              syncBluetoothState()
                          }
                      }

                      webChromeClient = object : WebChromeClient() {
                          override fun onShowFileChooser(
                              webView: WebView?,
                              callback: ValueCallback<Array<Uri>>?,
                              params: FileChooserParams?
                          ): Boolean {
                              filePathCallback?.onReceiveValue(null)
                              filePathCallback = callback
                              val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = "image/*"
                              }
                              startActivityForResult(Intent.createChooser(intent, "Escolher Foto do Fone"), 1001)
                              return true
                          }
                      }
                      loadUrl("file:///android_asset/index.html")
                  }

                  setContentView(webView)

                  val filter = IntentFilter().apply {
                      addAction("android.bluetooth.device.action.BATTERY_LEVEL_CHANGED")
                      addAction(BluetoothDevice.ACTION_ACL_DISCONNECTED)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(btReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(btReceiver, filter)
                  }
              }

              private fun requestNeededPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      if (checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.BLUETOOTH_CONNECT), 100)
                      }
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Ative a permissão 'Aparecer sobre outros apps'", Toast.LENGTH_LONG).show()
                      val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      startActivity(intent)
                  }
              }

              @SuppressLint("MissingPermission")
              private fun syncBluetoothState() {
                  try {
                      val adapter = BluetoothAdapter.getDefaultAdapter() ?: return
                      for (device in adapter.bondedDevices) {
                          val name = device.name ?: continue
                          if (name.contains("Studio Pro", true) || name.contains("UGREEN", true)) {
                              val isConn = try {
                                  device.javaClass.getMethod("isConnected").invoke(device) as? Boolean ?: false
                              } catch (e: Exception) { false }

                              val battery = try {
                                  device.javaClass.getMethod("getBatteryLevel").invoke(device) as? Int ?: 100
                              } catch (e: Exception) { 100 }

                              if (isConn) {
                                  activeDevice = device
                                  pushToWeb(name, if (battery in 0..100) battery else 100, true)
                                  return
                              }
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun hexToBytes(hex: String): ByteArray {
                  val clean = hex.replace(" ", "")
                  val data = ByteArray(clean.length / 2)
                  var i = 0
                  while (i < clean.length) {
                      data[i / 2] = clean.substring(i, i + 2).toInt(16).toByte()
                      i += 2
                  }
                  return data
              }

              @SuppressLint("MissingPermission")
              private fun sendUgreenCommand(hexCmd: String) {
                  Thread {
                      try {
                          if (activeDevice == null) {
                              syncBluetoothState()
                          }
                          val dev = activeDevice ?: return@Thread

                          var sock = rfcommSocket
                          if (sock == null || !sock.isConnected) {
                              val newSock = try {
                                  dev.createInsecureRfcommSocketToServiceRecord(sppUuid).apply { connect() }
                              } catch (e1: Exception) {
                                  try {
                                      dev.createRfcommSocketToServiceRecord(sppUuid).apply { connect() }
                                  } catch (e2: Exception) {
                                      val m = dev.javaClass.getMethod("createRfcommSocket", Int::class.java)
                                      (m.invoke(dev, Integer.valueOf(1)) as BluetoothSocket).apply { connect() }
                                  }
                              }
                              rfcommSocket = newSock
                              sock = newSock
                              newSock.outputStream.write(hexToBytes("AA BB CC 04 01 00 31 91"))
                              newSock.outputStream.flush()
                              Thread.sleep(60L)
                              newSock.outputStream.write(hexToBytes("AA BB CC 01 01 00 21 90"))
                              newSock.outputStream.flush()
                              Thread.sleep(60L)
                          }

                          sock?.outputStream?.write(hexToBytes(hexCmd))
                          sock?.outputStream?.flush()
                      } catch (e: Exception) {
                          closeRfcomm()
                      }
                  }.start()
              }

              private fun closeRfcomm() {
                  try { rfcommSocket?.close() } catch (e: Exception) {}
                  rfcommSocket = null
              }

              private fun pushToWeb(name: String?, battery: Int, connected: Boolean) {
                  val safeName = name?.let { "'$it'" } ?: "null"
                  webView.post {
                      webView.evaluateJavascript("if(window.updateFromAndroid) window.updateFromAndroid($safeName, $battery, $connected);", null)
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1001) {
                      val result = if (resultCode == RESULT_OK && data?.data != null) arrayOf(data.data!!) else null
                      filePathCallback?.onReceiveValue(result)
                      filePathCallback = null
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  closeRfcomm()
                  try { unregisterReceiver(btReceiver) } catch (e: Exception) {}
              }

              inner class AndroidBridge {
                  @JavascriptInterface
                  fun closeOverlay() {
                      runOnUiThread {
                          closeRfcomm()
                          finish()
                      }
                  }

                  @JavascriptInterface
                  fun setAncMode(mode: String) {
                      when (mode) {
                          "anc" -> sendUgreenCommand("AA BB CC 09 01 A1 61 EA")
                          "off" -> sendUgreenCommand("AA BB CC 09 01 A0 A0 2A")
                          "transparency" -> sendUgreenCommand("AA BB CC 09 01 A2 21 EB")
                      }
                  }

                  @JavascriptInterface
                  fun savePermanentPhoto(dataUrl: String) {
                      try {
                          File(filesDir, "ugreen_cutout.txt").writeText(dataUrl)
                      } catch (e: Exception) {}
                  }

                  @JavascriptInterface
                  fun loadPermanentPhoto(): String {
                      return try {
                          val f = File(filesDir, "ugreen_cutout.txt")
                          if (f.exists()) f.readText() else ""
                      } catch (e: Exception) { "" }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/anderson/studiopro/StudioProReceiver.kt
          package com.anderson.studiopro

          import android.annotation.SuppressLint
          import android.bluetooth.BluetoothDevice
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class StudioProReceiver : BroadcastReceiver() {
              @SuppressLint("MissingPermission")
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action != BluetoothDevice.ACTION_ACL_CONNECTED) return
                  val device: BluetoothDevice? = intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                  val name = device?.name ?: return

                  if (name.contains("Studio Pro", ignoreCase = true) ||
                      name.contains("UGREEN", ignoreCase = true)) {
                      val popupIntent = Intent(context, MainActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      }
                      context.startActivity(popupIntent)
                  }
              }
          }
          EOF

      - name: Compilar o APK
        run: gradle assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: StudioPro-S24FE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
