<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UGREEN Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatOnly {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-8px); }
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scale(1); opacity: 0.26; }
      50%      { transform: scale(0.84); opacity: 0.14; }
    }

    .headphone-float {
      animation: floatOnly 3.6s ease-in-out infinite;
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.16));
    }

    .floor-shadow {
      width: 115px;
      height: 14px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 72%);
      border-radius: 50%;
      animation: shadowPulse 3.6s ease-in-out infinite;
    }

    /* Anel de radar ao procurar o fone para parear */
    @keyframes radarPing {
      0% { transform: scale(0.85); opacity: 0.75; }
      100% { transform: scale(1.65); opacity: 0; }
    }
    .radar-ring {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 9999px;
      border: 2.5px solid rgba(168, 130, 255, 0.65);
      animation: radarPing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      pointer-events: none;
    }

    /* Estilo Sea Glass (Vidro Fosco Granulado com Borda Brilhante) */
    .sea-glass-bar {
      background: linear-gradient(135deg, rgba(236, 194, 255, 0.58) 0%, rgba(196, 215, 255, 0.58) 100%);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 24px -6px rgba(168, 130, 255, 0.28), inset 0 1px 2px rgba(255, 255, 255, 0.95);
    }

    .sea-glass-pill-active {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 246, 255, 0.85) 100%);
      border: 1.5px solid rgba(255, 255, 255, 1);
      box-shadow: 0 6px 14px rgba(110, 130, 230, 0.22), inset 0 1px 1px rgba(255, 255, 255, 1);
      color: #2b1954;
    }

    .sea-glass-btn-main {
      background: linear-gradient(135deg, #c7d8ff 0%, #e5b8ff 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 22px -4px rgba(145, 158, 255, 0.45), inset 0 1.5px 2px rgba(255, 255, 255, 0.95);
      color: #1e295b;
    }
  </style>
</head>
<body id="backdrop" onclick="handleBackdropClick(event)" class="min-h-screen w-full flex flex-col justify-end items-center select-none font-sans overflow-hidden">

  <!-- SOMENTE O CARTÃO POP-UP NA PARTE INFERIOR -->
  <div id="view-popup" onclick="event.stopPropagation()" class="w-full max-w-md mx-3 mb-3 bg-white/95 backdrop-blur-xl rounded-[38px] p-6 shadow-2xl border border-white relative animate-slide-up transition-all duration-300">

    <!-- Botão Fechar (X) -->
    <button onclick="closePopup()" class="absolute top-5 right-5 w-8 h-8 rounded-full bg-neutral-100 hover:bg-neutral-200 flex items-center justify-center text-neutral-500 font-bold">
      ✕
    </button>

    <!-- Título do Auscultador -->
    <h2 id="device-title" class="text-center text-[22px] font-bold tracking-tight text-neutral-900 mt-1">
      UGREEN Studio Pro
    </h2>

    <!-- Área Central Fixa (Sem clique de upload de foto) -->
    <div class="relative h-52 flex flex-col items-center justify-center my-1">
      <!-- Ondas de radar (só aparecem enquanto procura o fone para parear) -->
      <div id="search-radar" class="hidden items-center justify-center">
        <div class="radar-ring"></div>
        <div class="radar-ring" style="animation-delay: 0.6s"></div>
      </div>

      <div id="card-float-wrapper" class="flex flex-col items-center justify-center z-10">
        <img id="img-popup"
             src="ugreen_cutout.png"
             class="headphone-float h-36 w-auto object-contain select-none pointer-events-none"
             alt="UGREEN Studio Pro" />
        <div class="floor-shadow mt-2"></div>
      </div>

      <!-- Anel Circular Verde de Bateria -->
      <div id="popup-battery-badge" class="hidden items-center gap-2 mt-2 z-10">
        <div class="relative w-7 h-7 flex items-center justify-center">
          <svg class="w-7 h-7 -rotate-90" viewBox="0 0 44 44">
            <circle cx="22" cy="22" r="18" stroke="#E5E5EA" stroke-width="4.5" fill="none"></circle>
            <circle id="battery-ring" cx="22" cy="22" r="18" stroke="#34C759" stroke-width="4.5" stroke-dasharray="113.1" stroke-dashoffset="0" stroke-linecap="round" fill="none"></circle>
          </svg>
        </div>
        <span id="popup-battery-text" class="text-[14px] font-bold text-neutral-800">100%</span>
      </div>
    </div>

    <!-- Texto de estado / instrução -->
    <p id="popup-desc" class="text-[11px] leading-snug text-center text-neutral-400 px-4 mb-5">
      Toque em Connect para procurar e parear o seu UGREEN Studio Pro.
    </p>

    <!-- Seletor de Controlo de Ruído no Estilo Sea Glass -->
    <div id="anc-controls" class="hidden mb-4">
      <div class="sea-glass-bar p-1.5 rounded-full grid grid-cols-3 gap-1.5">
        <button onclick="setListeningMode('off')" id="mode-off" class="py-2.5 rounded-full flex items-center justify-center gap-1.5 text-indigo-950/60 font-semibold text-[12px] transition">
          <span>⚪</span>
          <span>Off</span>
        </button>
        <button onclick="setListeningMode('transparency')" id="mode-transparency" class="py-2.5 rounded-full flex items-center justify-center gap-1.5 text-indigo-950/60 font-semibold text-[12px] transition">
          <span>👂</span>
          <span>Ambiente</span>
        </button>
        <button onclick="setListeningMode('anc')" id="mode-anc" class="py-2.5 rounded-full flex items-center justify-center gap-1.5 sea-glass-pill-active font-bold text-[12px] transition">
          <span>🟢</span>
          <span>ANC</span>
        </button>
      </div>
    </div>

    <!-- Botão Principal -->
    <button id="btn-main-action" onclick="handleMainAction()" class="w-full py-3.5 rounded-full text-[16px] font-bold sea-glass-btn-main active:scale-[0.98] transition flex items-center justify-center gap-2">
      <span id="btn-spinner" class="hidden w-4 h-4 border-2 border-indigo-950 border-t-transparent rounded-full animate-spin"></span>
      <span id="btn-text">Connect</span>
    </button>
  </div>

  <script>
    let isConnected = false;
    let isSearching = false;

    function handleBackdropClick(event) {
      if (event.target.id === 'backdrop') {
        closePopup();
      }
    }

    function updateBattery(val) {
      document.getElementById('popup-battery-text').innerText = val + '%';
      const offset = 113.1 - (val / 100) * 113.1;
      const ring = document.getElementById('battery-ring');
      if (ring) ring.style.strokeDashoffset = offset;
    }

    function setListeningMode(mode) {
      ['off', 'transparency', 'anc'].forEach((m) => {
        const el = document.getElementById('mode-' + m);
        el.className = m === mode
          ? 'py-2.5 rounded-full flex items-center justify-center gap-1.5 sea-glass-pill-active font-bold text-[12px] transition'
          : 'py-2.5 rounded-full flex items-center justify-center gap-1.5 text-indigo-950/60 font-semibold text-[12px] transition';
      });
    }

    function handleMainAction() {
      if (isConnected) {
        closePopup();
        return;
      }
      if (isSearching) return;

      // Entra no modo "Procurando fone para parear / conectar"
      isSearching = true;
      document.getElementById('search-radar').classList.remove('hidden');
      document.getElementById('search-radar').classList.add('flex');
      document.getElementById('btn-spinner').classList.remove('hidden');
      document.getElementById('btn-text').innerText = 'Procurando fone...';
      document.getElementById('popup-desc').innerText = 'A procurar o UGREEN Studio Pro no Bluetooth para parear...';

      if (window.AndroidBridge && window.AndroidBridge.startPairingOrConnect) {
        window.AndroidBridge.startPairingOrConnect();
      }
    }

    // Chamado pelo Android para atualizar o texto enquanto procura ou pareia
    window.updateSearchStatus = function(statusMessage, resetButton) {
      document.getElementById('popup-desc').innerText = statusMessage;
      if (resetButton) {
        isSearching = false;
        document.getElementById('search-radar').classList.add('hidden');
        document.getElementById('search-radar').classList.remove('flex');
        document.getElementById('btn-spinner').classList.add('hidden');
        document.getElementById('btn-text').innerText = 'Connect';
      }
    };

    // Chamado pelo Android assim que o fone pareia e conecta
    window.onDeviceConnected = function(deviceName, batteryLevel) {
      isSearching = false;
      isConnected = true;

      if (deviceName) {
        document.getElementById('device-title').innerText = deviceName;
      }
      if (batteryLevel >= 0 && batteryLevel <= 100) {
        updateBattery(batteryLevel);
      }

      document.getElementById('search-radar').classList.add('hidden');
      document.getElementById('search-radar').classList.remove('flex');
      document.getElementById('btn-spinner').classList.add('hidden');

      document.getElementById('popup-battery-badge').classList.remove('hidden');
      document.getElementById('popup-battery-badge').classList.add('flex');
      document.getElementById('popup-desc').classList.add('hidden');
      document.getElementById('anc-controls').classList.remove('hidden');

      document.getElementById('btn-text').innerText = 'Concluído';
    };

    function closePopup() {
      document.getElementById('view-popup').classList.add('hidden');
      if (window.AndroidBridge) window.AndroidBridge.closeOverlay();
    }

    window.updateFromAndroid = function(deviceName, batteryLevel, connected) {
      if (connected) {
        window.onDeviceConnected(deviceName, batteryLevel);
      } else {
        if (deviceName) document.getElementById('device-title').innerText = deviceName;
      }
    };
  </script>
</body>
</html>
