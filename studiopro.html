<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Studio Pro & QCY Popup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatOnly {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-8px); }
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scale(1); opacity: 0.26; }
      50%      { transform: scale(0.84); opacity: 0.14; }
    }

    .headphone-float {
      animation: floatOnly 3.6s ease-in-out infinite;
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.16));
    }

    .floor-shadow {
      width: 115px;
      height: 14px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 72%);
      border-radius: 50%;
      animation: shadowPulse 3.6s ease-in-out infinite;
    }
  </style>
</head>
<body id="backdrop" onclick="handleBackdropClick(event)" class="min-h-screen w-full flex flex-col justify-end items-center select-none font-sans overflow-hidden">

  <!-- SOMENTE O CARTÃO POP-UP NA PARTE INFERIOR -->
  <div id="view-popup" onclick="event.stopPropagation()" class="w-full max-w-md mx-3 mb-3 bg-white rounded-[38px] p-6 shadow-2xl relative animate-slide-up transition-all duration-300">

    <input type="file" id="file-input" accept="image/*" class="hidden" onclick="event.stopPropagation()" onchange="handlePhotoUpload(event)" />

    <!-- Botão Fechar (X) -->
    <button onclick="closePopup()" class="absolute top-5 right-5 w-8 h-8 rounded-full bg-neutral-100 hover:bg-neutral-200 flex items-center justify-center text-neutral-500 font-bold">
      ✕
    </button>

    <!-- Título do Auscultador (Toque no título para alternar manualmente entre Studio Pro e QCY H3S) -->
    <h2 id="device-title"
        onclick="switchDeviceProfile()"
        title="Toque para alternar entre UGREEN Studio Pro e QCY H3S"
        class="text-center text-[22px] font-bold tracking-tight text-neutral-900 mt-1 cursor-pointer active:opacity-60 transition">
      UGREEN Studio Pro
    </h2>

    <!-- Área Central: Auscultador a Flutuar + Anel Verde de Bateria -->
    <label for="file-input"
           onclick="event.stopPropagation()"
           class="relative h-52 flex flex-col items-center justify-center my-1 cursor-pointer">

      <!-- Aparece quando ainda não há foto guardada para este modelo -->
      <div id="empty-prompt" class="flex flex-col items-center justify-center border-2 border-dashed border-blue-400 bg-blue-50/60 rounded-3xl w-52 h-40 p-4 text-center">
        <span class="text-3xl mb-1">🎧</span>
        <p id="empty-prompt-text" class="text-xs font-bold text-blue-600">Toque aqui para escolher a foto do UGREEN Studio Pro</p>
      </div>

      <!-- Imagem Recortada a Flutuar -->
      <div id="card-float-wrapper" class="hidden flex-col items-center justify-center">
        <img id="img-popup" class="headphone-float h-36 w-auto object-contain select-none pointer-events-none" alt="Fone" />
        <div class="floor-shadow mt-2"></div>
      </div>

      <!-- Anel Circular Verde de Bateria (Estilo iOS 100%) -->
      <div id="popup-battery-badge" class="hidden items-center gap-2 mt-2">
        <div class="relative w-7 h-7 flex items-center justify-center">
          <svg class="w-7 h-7 -rotate-90" viewBox="0 0 44 44">
            <circle cx="22" cy="22" r="18" stroke="#E5E5EA" stroke-width="4.5" fill="none"></circle>
            <circle id="battery-ring" cx="22" cy="22" r="18" stroke="#34C759" stroke-width="4.5" stroke-dasharray="113.1" stroke-dashoffset="0" stroke-linecap="round" fill="none"></circle>
          </svg>
        </div>
        <span id="popup-battery-text" class="text-[14px] font-bold text-neutral-800">100%</span>
      </div>
    </label>

    <!-- ESTADO 1: Texto descritivo antes de clicar em Connect -->
    <p id="popup-desc" class="text-[11px] leading-snug text-center text-neutral-400 px-4 mb-5">
      Toque no nome acima para alternar entre Studio Pro e QCY H3S, ou toque na foto para a alterar.
    </p>

    <!-- ESTADO 2: Seletor de Controlo de Ruído (aparece dentro do próprio cartão ao ligar) -->
    <div id="anc-controls" class="hidden mb-4">
      <div class="bg-[#F2F2F7] p-1 rounded-2xl grid grid-cols-3 gap-1">
        <button onclick="setListeningMode('off')" id="mode-off" class="py-2 rounded-xl flex flex-col items-center justify-center text-neutral-500 transition">
          <span class="text-sm">⚪</span>
          <span class="text-[11px] font-semibold mt-0.5">Off</span>
        </button>
        <button onclick="setListeningMode('transparency')" id="mode-transparency" class="py-2 rounded-xl flex flex-col items-center justify-center text-neutral-500 transition">
          <span class="text-sm">👂</span>
          <span class="text-[11px] font-semibold mt-0.5">Transparency</span>
        </button>
        <button onclick="setListeningMode('anc')" id="mode-anc" class="py-2 rounded-xl flex flex-col items-center justify-center bg-white shadow-sm text-neutral-900 transition">
          <span class="text-sm">🟢</span>
          <span class="text-[11px] font-semibold mt-0.5">ANC</span>
        </button>
      </div>
    </div>

    <!-- Botão Principal -->
    <button id="btn-main-action" onclick="handleMainAction()" class="w-full py-3.5 rounded-full text-[16px] font-semibold bg-[#007AFF] text-white shadow-md shadow-blue-500/20 active:scale-[0.98] transition">
      Connect
    </button>
  </div>

  <script>
    let isConnected = false;
    let isPickingFile = false;
    let currentProfile = 'ugreen'; // 'ugreen' | 'qcy'

    const PROFILES = {
      ugreen: {
        name: 'UGREEN Studio Pro',
        storageKey: 'ugreen_studio_pro_cutout'
      },
      qcy: {
        name: 'QCY H3S',
        storageKey: 'qcy_h3s_cutout'
      }
    };

    function handleBackdropClick(event) {
      if (isPickingFile) return;
      if (event.target.id === 'backdrop') {
        closePopup();
      }
    }

    // Alterna entre o perfil do UGREEN Studio Pro e do QCY H3S
    function switchDeviceProfile(forceProfile) {
      currentProfile = forceProfile || (currentProfile === 'ugreen' ? 'qcy' : 'ugreen');
      const profile = PROFILES[currentProfile];
      document.getElementById('device-title').innerText = profile.name;
      document.getElementById('empty-prompt-text').innerText = 'Toque aqui para escolher a foto do ' + profile.name;

      const savedPhoto = localStorage.getItem(profile.storageKey);
      if (savedPhoto) {
        applyCutoutImage(savedPhoto);
      } else {
        document.getElementById('card-float-wrapper').classList.add('hidden');
        document.getElementById('card-float-wrapper').classList.remove('flex');
        document.getElementById('empty-prompt').classList.remove('hidden');
      }
    }

    function handlePhotoUpload(event) {
      isPickingFile = true;
      const file = event.target.files?.[0];
      if (!file) {
        isPickingFile = false;
        return;
      }
      processImageFile(file);
    }

    function processImageFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 500;
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);

          const cvs = document.createElement('canvas');
          cvs.width = w;
          cvs.height = h;
          const ctx = cvs.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const imgData = ctx.getImageData(0, 0, w, h);
          const d = imgData.data;

          const r0 = d[0], g0 = d[1], b0 = d[2], a0 = d[3];
          if (a0 > 200) {
            const isWhiteBg = (r0 > 220 && g0 > 220 && b0 > 220);
            const isBlackBg = (r0 < 35 && g0 < 35 && b0 < 35);

            if (isWhiteBg || isBlackBg) {
              const visited = new Uint8Array(w * h);
              const queue = [0, w - 1, (h - 1) * w, (h - 1) * w + w - 1];

              while (queue.length > 0) {
                const idx = queue.pop();
                if (visited[idx]) continue;
                visited[idx] = 1;

                const p = idx * 4;
                const r = d[p], g = d[p + 1], b = d[p + 2];
                const lum = 0.299 * r + 0.587 * g + 0.114 * b;

                const isBg = isWhiteBg ? (lum > 232) : (lum < 28);
                if (isBg) {
                  d[p + 3] = 0;
                  const x = idx % w, y = (idx / w) | 0;
                  if (x > 0) queue.push(idx - 1);
                  if (x < w - 1) queue.push(idx + 1);
                  if (y > 0) queue.push(idx - w);
                  if (y < h - 1) queue.push(idx + w);
                } else if (isWhiteBg && lum > 208) {
                  d[p + 3] = Math.round(((232 - lum) / 24) * 255);
                } else if (isBlackBg && lum < 45) {
                  d[p + 3] = Math.round(((lum - 28) / 17) * 255);
                }
              }
              ctx.putImageData(imgData, 0, 0);
            }
          }

          const dataUrl = cvs.toDataURL('image/png');
          applyCutoutImage(dataUrl);
          try {
            localStorage.setItem(PROFILES[currentProfile].storageKey, dataUrl);
          } catch (err) {}
          setTimeout(() => { isPickingFile = false; }, 300);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function applyCutoutImage(dataUrl) {
      document.getElementById('empty-prompt').classList.add('hidden');
      const wrapper = document.getElementById('card-float-wrapper');
      wrapper.classList.remove('hidden');
      wrapper.classList.add('flex');
      document.getElementById('img-popup').src = dataUrl;
    }

    function updateBattery(val) {
      document.getElementById('popup-battery-text').innerText = val + '%';
      const offset = 113.1 - (val / 100) * 113.1;
      const ring = document.getElementById('battery-ring');
      if (ring) ring.style.strokeDashoffset = offset;
    }

    function setListeningMode(mode) {
      ['off', 'transparency', 'anc'].forEach((m) => {
        const el = document.getElementById('mode-' + m);
        el.className = m === mode
          ? 'py-2 rounded-xl flex flex-col items-center justify-center bg-white shadow-sm text-neutral-900 transition'
          : 'py-2 rounded-xl flex flex-col items-center justify-center text-neutral-500 transition';
      });
    }

    function handleMainAction() {
      if (!isConnected) {
        isConnected = true;
        document.getElementById('popup-battery-badge').classList.remove('hidden');
        document.getElementById('popup-battery-badge').classList.add('flex');
        document.getElementById('popup-desc').classList.add('hidden');
        document.getElementById('anc-controls').classList.remove('hidden');

        const btn = document.getElementById('btn-main-action');
        btn.innerText = 'Concluído';
        btn.className = 'w-full py-3.5 rounded-full text-[16px] font-semibold bg-neutral-200 text-neutral-900 active:scale-[0.98] transition';
      } else {
        closePopup();
      }
    }

    function closePopup() {
      document.getElementById('view-popup').classList.add('hidden');
      if (window.AndroidBridge) window.AndroidBridge.closeOverlay();
    }

    // Chamado automaticamente pelo Bluetooth do S24 FE quando o fone se liga
    window.updateFromAndroid = function(deviceName, batteryLevel, connected) {
      if (deviceName) {
        if (deviceName.toUpperCase().includes('QCY')) {
          switchDeviceProfile('qcy');
        } else {
          switchDeviceProfile('ugreen');
        }
        document.getElementById('device-title').innerText = deviceName;
      }
      if (batteryLevel >= 0 && batteryLevel <= 100) {
        updateBattery(batteryLevel);
      }
      if (connected && !isConnected) {
        handleMainAction();
      }
    };

    window.onload = () => {
      switchDeviceProfile('ugreen');
    };
  </script>
</body>
</html>
