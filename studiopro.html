<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UGREEN Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Animação suave apenas flutuando */
    @keyframes floatOnly {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-8px); }
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scale(1); opacity: 0.26; }
      50%      { transform: scale(0.84); opacity: 0.14; }
    }

    .headphone-float {
      animation: floatOnly 3.6s ease-in-out infinite;
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.16));
    }

    .floor-shadow {
      width: 115px;
      height: 14px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 72%);
      border-radius: 50%;
      animation: shadowPulse 3.6s ease-in-out infinite;
    }
  </style>
</head>
<body id="backdrop" onclick="handleBackdropClick(event)" class="min-h-screen w-full flex flex-col justify-end items-center select-none font-sans overflow-hidden">

  <!-- SOMENTE O CARTÃO POP-UP NA PARTE INFERIOR -->
  <div id="view-popup" onclick="event.stopPropagation()" class="w-full max-w-md mx-3 mb-3 bg-white rounded-[38px] p-6 shadow-2xl relative animate-slide-up">

    <!-- Input de foto seguro dentro do cartão (não dispara o fecho do fundo) -->
    <input type="file" id="file-input" accept="image/*" class="hidden" onclick="event.stopPropagation()" onchange="handlePhotoUpload(event)" />

    <!-- Botão Fechar (X) -->
    <button onclick="closePopup()" class="absolute top-5 right-5 w-8 h-8 rounded-full bg-neutral-100 hover:bg-neutral-200 flex items-center justify-center text-neutral-500 font-bold">
      ✕
    </button>

    <!-- Nome do Fone -->
    <h2 class="text-center text-[22px] font-bold tracking-tight text-neutral-900 mt-1">
      UGREEN Studio Pro
    </h2>

    <!-- Área Central: usa <label> nativo para abrir a Galeria sem fechar o app -->
    <label for="file-input"
           onclick="event.stopPropagation()"
           class="relative h-52 flex flex-col items-center justify-center my-2 cursor-pointer">

      <!-- Aparece apenas na 1.ª vez antes de escolher a foto -->
      <div id="empty-prompt" class="flex flex-col items-center justify-center border-2 border-dashed border-blue-400 bg-blue-50/60 rounded-3xl w-52 h-40 p-4 text-center">
        <span class="text-3xl mb-1">🎧</span>
        <p class="text-xs font-bold text-blue-600">Toque aqui para escolher a foto do fone</p>
      </div>

      <!-- Fone Flutuando -->
      <div id="card-float-wrapper" class="hidden flex-col items-center justify-center">
        <img id="img-popup" class="headphone-float h-40 w-auto object-contain select-none pointer-events-none" alt="UGREEN Studio Pro" />
        <div class="floor-shadow mt-3"></div>
      </div>

      <!-- Indicador de Bateria Real -->
      <div id="popup-battery-badge" class="hidden items-center gap-2 mt-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="popup-battery-text" class="text-sm font-semibold text-neutral-700">100%</span>
      </div>
    </label>

    <!-- Texto subtítulo estilo iOS -->
    <p id="popup-desc" class="text-[11px] leading-snug text-center text-neutral-400 px-4 mb-5">
      Pronto para conectar ao seu Galaxy S24 FE com suporte para Cancelamento de Ruído (ANC) e Som Ambiente.
    </p>

    <!-- Botão Azul Principal -->
    <button id="btn-main-action" onclick="handleMainAction()" class="w-full py-3.5 rounded-full text-[16px] font-semibold bg-[#007AFF] text-white shadow-md shadow-blue-500/20 active:scale-[0.98] transition">
      Connect
    </button>
  </div>

  <script>
    let isConnected = false;
    let isPickingFile = false;

    // Só fecha se o toque for realmente na parte vazia de cima
    function handleBackdropClick(event) {
      if (isPickingFile) return;
      if (event.target.id === 'backdrop') {
        closePopup();
      }
    }

    function handlePhotoUpload(event) {
      isPickingFile = true;
      const file = event.target.files?.[0];
      if (!file) {
        isPickingFile = false;
        return;
      }
      processImageFile(file);
    }

    // Usa FileReader (compatível com a Galeria do S24 FE) e remove o fundo automaticamente
    function processImageFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 500;
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);

          const cvs = document.createElement('canvas');
          cvs.width = w;
          cvs.height = h;
          const ctx = cvs.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const imgData = ctx.getImageData(0, 0, w, h);
          const d = imgData.data;

          const r0 = d[0], g0 = d[1], b0 = d[2], a0 = d[3];
          if (a0 > 200) {
            const isWhiteBg = (r0 > 220 && g0 > 220 && b0 > 220);
            const isBlackBg = (r0 < 35 && g0 < 35 && b0 < 35);

            if (isWhiteBg || isBlackBg) {
              const visited = new Uint8Array(w * h);
              const queue = [0, w - 1, (h - 1) * w, (h - 1) * w + w - 1];

              while (queue.length > 0) {
                const idx = queue.pop();
                if (visited[idx]) continue;
                visited[idx] = 1;

                const p = idx * 4;
                const r = d[p], g = d[p + 1], b = d[p + 2];
                const lum = 0.299 * r + 0.587 * g + 0.114 * b;

                const isBg = isWhiteBg ? (lum > 232) : (lum < 28);
                if (isBg) {
                  d[p + 3] = 0;
                  const x = idx % w, y = (idx / w) | 0;
                  if (x > 0) queue.push(idx - 1);
                  if (x < w - 1) queue.push(idx + 1);
                  if (y > 0) queue.push(idx - w);
                  if (y < h - 1) queue.push(idx + w);
                } else if (isWhiteBg && lum > 208) {
                  d[p + 3] = Math.round(((232 - lum) / 24) * 255);
                } else if (isBlackBg && lum < 45) {
                  d[p + 3] = Math.round(((lum - 28) / 17) * 255);
                }
              }
              ctx.putImageData(imgData, 0, 0);
            }
          }

          const dataUrl = cvs.toDataURL('image/png');
          applyCutoutImage(dataUrl);
          try { localStorage.setItem('ugreen_studio_pro_cutout', dataUrl); } catch (err) {}
          setTimeout(() => { isPickingFile = false; }, 300);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function applyCutoutImage(dataUrl) {
      document.getElementById('empty-prompt').classList.add('hidden');
      const wrapper = document.getElementById('card-float-wrapper');
      wrapper.classList.remove('hidden');
      wrapper.classList.add('flex');
      document.getElementById('img-popup').src = dataUrl;
    }

    function updateBattery(val) {
      document.getElementById('popup-battery-text').innerText = val + '%';
    }

    function handleMainAction() {
      if (!isConnected) {
        isConnected = true;
        document.getElementById('popup-battery-badge').classList.remove('hidden');
        document.getElementById('popup-battery-badge').classList.add('flex');
        const btn = document.getElementById('btn-main-action');
        btn.innerText = 'Concluído';
      } else {
        closePopup();
      }
    }

    function closePopup() {
      document.getElementById('view-popup').classList.add('hidden');
    }

    window.onload = () => {
      const saved = localStorage.getItem('ugreen_studio_pro_cutout');
      if (saved) applyCutoutImage(saved);
    };
  </script>
</body>
</html>
