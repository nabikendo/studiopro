<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UGREEN Studio Pro - Sea Glass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --light-x: 0px;
      --light-y: 8px;
      --rim-x: -1px;
      --rim-y: -1px;
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-border: rgba(255, 255, 255, 1);
      --text-main: #171717;
      --text-sub: #737373;
      --glass-grad-1: rgba(236, 194, 255, 0.62);
      --glass-grad-2: rgba(196, 218, 255, 0.62);
      --glass-shadow: rgba(168, 125, 245, 0.34);
      --btn-grad-1: #c7d8ff;
      --btn-grad-2: #e8b8ff;
      --ink-color: #261752;
    }

    body[data-ui-mode="dark"] {
      --card-bg: rgba(24, 24, 28, 0.96);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f5f5f7;
      --text-sub: #a1a1aa;
      --glass-grad-1: rgba(88, 62, 135, 0.55);
      --glass-grad-2: rgba(45, 72, 125, 0.55);
      --glass-shadow: rgba(0, 0, 0, 0.55);
      --btn-grad-1: #4f46e5;
      --btn-grad-2: #7c3aed;
      --ink-color: #ffffff;
    }

    body[data-glass="beach"] {
      --glass-grad-1: rgba(176, 245, 212, 0.68);
      --glass-grad-2: rgba(162, 232, 245, 0.68);
      --glass-shadow: rgba(72, 185, 150, 0.34);
      --btn-grad-1: #a7f3d0;
      --btn-grad-2: #99f6e4;
      --ink-color: #0b3b2e;
    }
    body[data-glass="frost"] {
      --glass-grad-1: rgba(242, 246, 252, 0.78);
      --glass-grad-2: rgba(225, 234, 245, 0.78);
      --glass-shadow: rgba(120, 138, 165, 0.28);
      --btn-grad-1: #e2e8f0;
      --btn-grad-2: #f1f5f9;
      --ink-color: #1e293b;
    }

    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
    }

    .popup-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      color: var(--text-main);
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatOnly {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-7px); }
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50%      { transform: scale(0.84); opacity: 0.14; }
    }

    .headphone-float {
      animation: floatOnly 3.6s ease-in-out infinite;
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.22));
    }

    .floor-shadow {
      width: 112px;
      height: 13px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 72%);
      border-radius: 50%;
      animation: shadowPulse 3.6s ease-in-out infinite;
    }

    @keyframes radarPing {
      0% { transform: scale(0.85); opacity: 0.75; }
      100% { transform: scale(1.65); opacity: 0; }
    }
    .radar-ring {
      position: absolute;
      width: 125px;
      height: 125px;
      border-radius: 9999px;
      border: 2.5px solid var(--glass-shadow);
      animation: radarPing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      pointer-events: none;
    }

    .sea-glass-surface {
      background: linear-gradient(135deg, var(--glass-grad-1) 0%, var(--glass-grad-2) 100%);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      box-shadow:
        var(--light-x) var(--light-y) 22px -4px var(--glass-shadow),
        inset var(--rim-x) var(--rim-y) 3px rgba(255, 255, 255, 0.85);
      color: var(--ink-color);
      transition: background 0.3s ease, box-shadow 0.08s ease-out;
    }

    .sea-glass-pill-active {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96) 0%, rgba(245, 248, 255, 0.9) 100%);
      border: 1.5px solid rgba(255, 255, 255, 1);
      box-shadow:
        var(--light-x) calc(var(--light-y) * 0.6) 14px var(--glass-shadow),
        inset 0 1px 2px rgba(255, 255, 255, 1);
      color: #1e124a !important;
    }

    .sea-glass-btn-main {
      background: linear-gradient(135deg, var(--btn-grad-1) 0%, var(--btn-grad-2) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        var(--light-x) var(--light-y) 22px -3px var(--glass-shadow),
        inset var(--rim-x) var(--rim-y) 3px rgba(255, 255, 255, 0.9);
      color: var(--ink-color);
      transition: all 0.25s ease;
    }
  </style>
</head>
<body id="backdrop" data-ui-mode="light" data-glass="sea" onclick="handleBackdropClick(event)" class="min-h-screen w-full flex flex-col justify-end items-center select-none font-sans overflow-hidden">

  <div id="view-popup"
       onpointerdown="cancelAutoDismiss()"
       onclick="event.stopPropagation()"
       class="popup-card w-full max-w-md mx-3 mb-3 backdrop-blur-2xl rounded-[38px] p-5 shadow-2xl relative animate-slide-up overflow-hidden">

    <div class="flex items-center justify-between mb-1">
      <div class="flex items-center gap-1.5">
        <button onclick="cycleUiMode()" id="btn-ui-mode" title="Alternar Tema (Claro / Escuro / Sistema)" class="w-8 h-8 rounded-full sea-glass-surface flex items-center justify-center text-xs active:scale-90 transition">
          ☀️
        </button>
        <button onclick="cycleGlassTheme()" title="Cor do Vidro (Sea / Beach / Frost)" class="w-8 h-8 rounded-full sea-glass-surface flex items-center justify-center font-bold text-xs active:scale-90 transition">
          G
        </button>
        <button onclick="quickSwitchAudio()" id="btn-quick-switch" class="px-2.5 h-8 rounded-full sea-glass-surface flex items-center gap-1 text-[11px] font-semibold active:scale-95 transition">
          <span>🔄</span>
          <span id="quick-switch-label">Áudio</span>
        </button>
      </div>

      <button onclick="closePopup()" class="w-8 h-8 rounded-full bg-neutral-500/15 hover:bg-neutral-500/25 flex items-center justify-center font-bold active:scale-90 transition">
        ✕
      </button>
    </div>

    <div class="flex flex-col items-center">
      <h2 id="device-title" class="text-center text-[21px] font-bold tracking-tight">
        UGREEN Studio Pro
      </h2>
      <span id="low-latency-badge" class="hidden mt-0.5 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-400/25 text-amber-500 border border-amber-400/40">
        ⚡ Low Latency Game Mode
      </span>
    </div>

    <div class="relative h-44 flex flex-col items-center justify-center my-0.5">
      <div id="search-radar" class="hidden items-center justify-center">
        <div class="radar-ring"></div>
        <div class="radar-ring" style="animation-delay: 0.6s"></div>
      </div>

      <div id="card-float-wrapper" class="flex flex-col items-center justify-center z-10">
        <img id="img-popup" src="ugreen_cutout.png" class="headphone-float h-28 w-auto object-contain select-none pointer-events-none" alt="UGREEN Studio Pro" />
        <div class="floor-shadow mt-1.5"></div>
      </div>

      <!-- Bateria visível SOMENTE quando conectado -->
      <button onclick="refreshDeviceBattery()" id="popup-battery-badge" title="Atualizar bateria" class="hidden items-center gap-2 mt-2 px-3 py-1 rounded-full sea-glass-surface z-10 active:scale-95 transition">
        <div class="relative w-5 h-5 flex items-center justify-center">
          <svg class="w-5 h-5 -rotate-90" viewBox="0 0 44 44">
            <circle cx="22" cy="22" r="18" stroke="rgba(150,150,150,0.25)" stroke-width="5" fill="none"></circle>
            <circle id="battery-ring" cx="22" cy="22" r="18" stroke="#34C759" stroke-width="5" stroke-dasharray="113.1" stroke-dashoffset="0" stroke-linecap="round" fill="none"></circle>
          </svg>
        </div>
        <span id="popup-battery-text" class="text-[12px] font-bold">100%</span>
        <span id="popup-battery-hours" class="text-[10px] opacity-75 font-medium">• ~80h</span>
      </button>
    </div>

    <p id="popup-desc" style="color: var(--text-sub)" class="text-[11px] leading-snug text-center px-4 mb-4">
      Toque em Connect para procurar e parear o seu UGREEN Studio Pro.
    </p>

    <div id="chameleon-headphone-panel" class="hidden space-y-2.5 mb-3.5">
      <div class="sea-glass-surface p-1.5 rounded-full grid grid-cols-3 gap-1">
        <button onclick="setListeningMode('off')" id="mode-off" class="py-2 rounded-full flex items-center justify-center gap-1 opacity-75 font-semibold text-[12px] transition">
          <span>⚪</span><span>Off</span>
        </button>
        <button onclick="setListeningMode('transparency')" id="mode-transparency" class="py-2 rounded-full flex items-center justify-center gap-1 opacity-75 font-semibold text-[12px] transition">
          <span>👂</span><span>Ambiente</span>
        </button>
        <button onclick="setListeningMode('anc')" id="mode-anc" class="py-2 rounded-full flex items-center justify-center gap-1 sea-glass-pill-active font-bold text-[12px] transition">
          <span>🟢</span><span>ANC</span>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="cycleAncDepth()" id="pill-anc-depth" class="sea-glass-surface py-2 px-3 rounded-full flex items-center justify-between text-[11px] font-semibold active:scale-95 transition">
          <span class="opacity-75">ANC:</span>
          <span id="label-anc-depth" class="font-bold">Profundo</span>
        </button>
        <button onclick="toggleWindMode()" id="pill-wind" class="sea-glass-surface py-2 px-3 rounded-full flex items-center justify-between text-[11px] font-semibold active:scale-95 transition">
          <span class="opacity-75">🌬️ Vento:</span>
          <span id="label-wind" class="font-bold">Off</span>
        </button>
        <button onclick="cycleEqPreset()" id="pill-eq" class="sea-glass-surface py-2 px-3 rounded-full flex items-center justify-between text-[11px] font-semibold active:scale-95 transition">
          <span class="opacity-75">🎵 EQ:</span>
          <span id="label-eq" class="font-bold">Jazz</span>
        </button>
        <button onclick="toggleGameMode()" id="pill-game" class="sea-glass-surface py-2 px-3 rounded-full flex items-center justify-between text-[11px] font-semibold active:scale-95 transition">
          <span class="opacity-75">🎮 Jogo:</span>
          <span id="label-game" class="font-bold">Fechar</span>
        </button>
      </div>
    </div>

    <button id="btn-main-action" onclick="handleMainAction()" class="w-full py-3.5 rounded-full text-[16px] font-bold sea-glass-btn-main active:scale-[0.98] transition flex items-center justify-center gap-2">
      <span id="btn-spinner" class="hidden w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin"></span>
      <span id="btn-text">Connect</span>
    </button>

    <div id="glass-toast" class="hidden absolute top-14 left-1/2 -translate-x-1/2 px-3.5 py-1 rounded-full bg-black/80 text-white shadow-md text-[11px] font-semibold z-50">
      Claro
    </div>
  </div>

  <script>
    let isConnected = false;
    let isSearching = false;
    let currentBattery = 100;
    let autoDismissTimer = null;

    const UI_MODES = [
      { id: 'light', icon: '☀️', label: 'Modo Claro' },
      { id: 'dark', icon: '🌙', label: 'Modo Escuro' },
      { id: 'system', icon: '📱', label: 'Automático do Sistema' }
    ];
    let uiModeIdx = 0;

    const GLASS_THEMES = [
      { id: 'sea', label: 'Sea glass' },
      { id: 'beach', label: 'Beach glass' },
      { id: 'frost', label: 'Frost glass' }
    ];
    let themeIdx = 0;

    const ANC_DEPTHS = ['Profundo', 'Geral', 'Suave'];
    let depthIdx = 0;
    let windOn = false;
    const EQ_PRESETS = ['Jazz', 'Clássico', 'Baixo', 'Pop'];
    let eqIdx = 0;
    let gameModeOn = false;

    function vibrateTick() {
      if (window.AndroidBridge && window.AndroidBridge.vibrateTick) {
        window.AndroidBridge.vibrateTick();
      } else if (navigator.vibrate) {
        navigator.vibrate(14);
      }
    }

    function showToast(text) {
      const toast = document.getElementById('glass-toast');
      toast.innerText = text;
      toast.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toast.classList.add('hidden'), 1400);
    }

    function applyUiMode(modeId) {
      if (modeId === 'system') {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.body.setAttribute('data-ui-mode', prefersDark ? 'dark' : 'light');
      } else {
        document.body.setAttribute('data-ui-mode', modeId);
      }
    }

    function cycleUiMode() {
      vibrateTick();
      uiModeIdx = (uiModeIdx + 1) % UI_MODES.length;
      const mode = UI_MODES[uiModeIdx];
      applyUiMode(mode.id);
      document.getElementById('btn-ui-mode').innerText = mode.icon;
      localStorage.setItem('studio_pro_ui_mode', String(uiModeIdx));
      showToast(mode.label);
    }

    function cycleGlassTheme() {
      vibrateTick();
      themeIdx = (themeIdx + 1) % GLASS_THEMES.length;
      const t = GLASS_THEMES[themeIdx];
      document.body.setAttribute('data-glass', t.id);
      localStorage.setItem('studio_pro_glass_theme', String(themeIdx));
      showToast(t.label);
    }

    function refreshDeviceBattery() {
      vibrateTick();
      if (window.AndroidBridge && window.AndroidBridge.requestBatteryUpdate) {
        const level = window.AndroidBridge.requestBatteryUpdate();
        if (level >= 0 && level <= 100) {
          updateBattery(level);
          showToast('Bateria atualizada: ' + level + '%');
          return;
        }
      }
      showToast('Bateria do dispositivo: ' + currentBattery + '%');
    }

    function updateBattery(val) {
      currentBattery = val;
      document.getElementById('popup-battery-text').innerText = val + '%';
      const offset = 113.1 - (val / 100) * 113.1;
      const ring = document.getElementById('battery-ring');
      if (ring) {
        ring.style.strokeDashoffset = offset;
        ring.setAttribute('stroke', val <= 20 ? '#FF3B30' : '#34C759');
      }
      document.getElementById('popup-battery-hours').innerText = '• ~' + Math.max(1, Math.round((val / 100) * 80)) + 'h';
    }

    // Auto-fechar silencioso ajustado para 5 segundos
    function startAutoDismissTimer() {
      cancelAutoDismiss();
      autoDismissTimer = setTimeout(() => {
        closePopup();
      }, 5000);
    }

    function cancelAutoDismiss() {
      if (autoDismissTimer) {
        clearTimeout(autoDismissTimer);
        autoDismissTimer = null;
      }
    }

    function updateLightShift(nx, ny) {
      const lx = Math.max(-12, Math.min(12, nx * 16));
      const ly = Math.max(2, Math.min(16, 8 + ny * 12));
      document.documentElement.style.setProperty('--light-x', lx.toFixed(1) + 'px');
      document.documentElement.style.setProperty('--light-y', ly.toFixed(1) + 'px');
      document.documentElement.style.setProperty('--rim-x', (-lx * 0.18).toFixed(1) + 'px');
      document.documentElement.style.setProperty('--rim-y', (-ly * 0.18).toFixed(1) + 'px');
    }

    window.addEventListener('deviceorientation', (e) => {
      if (e.gamma !== null && e.beta !== null) {
        updateLightShift(e.gamma / 30, (e.beta - 45) / 30);
      }
    });

    window.addEventListener('pointermove', (e) => {
      const nx = (e.clientX / window.innerWidth) - 0.5;
      const ny = (e.clientY / window.innerHeight) - 0.5;
      updateLightShift(nx * 1.5, ny * 1.5);
    });

    function cycleAncDepth() {
      vibrateTick();
      depthIdx = (depthIdx + 1) % ANC_DEPTHS.length;
      const depth = ANC_DEPTHS[depthIdx];
      document.getElementById('label-anc-depth').innerText = depth;
      if (window.AndroidBridge && window.AndroidBridge.setUgreenExtra) {
        window.AndroidBridge.setUgreenExtra('anc_depth', depth.toLowerCase());
      }
    }

    function toggleWindMode() {
      vibrateTick();
      windOn = !windOn;
      document.getElementById('label-wind').innerText = windOn ? 'Ativo' : 'Off';
      document.getElementById('pill-wind').classList.toggle('sea-glass-pill-active', windOn);
      if (window.AndroidBridge && window.AndroidBridge.setUgreenExtra) {
        window.AndroidBridge.setUgreenExtra('wind', windOn ? 'on' : 'off');
      }
    }

    function cycleEqPreset() {
      vibrateTick();
      eqIdx = (eqIdx + 1) % EQ_PRESETS.length;
      const eq = EQ_PRESETS[eqIdx];
      document.getElementById('label-eq').innerText = eq;
      if (window.AndroidBridge && window.AndroidBridge.setUgreenExtra) {
        window.AndroidBridge.setUgreenExtra('eq', eq.toLowerCase());
      }
    }

    function toggleGameMode() {
      vibrateTick();
      gameModeOn = !gameModeOn;
      document.getElementById('label-game').innerText = gameModeOn ? 'Ativo ⚡' : 'Fechar';
      document.getElementById('pill-game').classList.toggle('sea-glass-pill-active', gameModeOn);
      document.getElementById('low-latency-badge').classList.toggle('hidden', !gameModeOn);
      if (window.AndroidBridge && window.AndroidBridge.setUgreenExtra) {
        window.AndroidBridge.setUgreenExtra('game_mode', gameModeOn ? 'on' : 'off');
      }
    }

    function quickSwitchAudio() {
      vibrateTick();
      if (window.AndroidBridge && window.AndroidBridge.switchAudioDevice) {
        window.AndroidBridge.switchAudioDevice();
      } else {
        showToast('Alternando saída de áudio...');
      }
    }

    function handleBackdropClick(event) {
      if (event.target.id === 'backdrop') {
        closePopup();
      }
    }

    function setListeningMode(mode) {
      vibrateTick();
      ['off', 'transparency', 'anc'].forEach((m) => {
        const el = document.getElementById('mode-' + m);
        el.className = m === mode
          ? 'py-2 rounded-full flex items-center justify-center gap-1 sea-glass-pill-active font-bold text-[12px] transition'
          : 'py-2 rounded-full flex items-center justify-center gap-1 opacity-75 font-semibold text-[12px] transition';
      });
      if (window.AndroidBridge && window.AndroidBridge.setAncMode) {
        window.AndroidBridge.setAncMode(mode);
      }
    }

    function handleMainAction() {
      vibrateTick();
      cancelAutoDismiss();
      if (isConnected) {
        closePopup();
        return;
      }
      if (isSearching) return;

      isSearching = true;
      document.getElementById('search-radar').classList.remove('hidden');
      document.getElementById('search-radar').classList.add('flex');
      document.getElementById('btn-spinner').classList.remove('hidden');
      document.getElementById('btn-text').innerText = 'Procurando fone...';
      document.getElementById('popup-desc').innerText = 'A procurar o UGREEN Studio Pro para parear...';

      if (window.AndroidBridge && window.AndroidBridge.startPairingOrConnect) {
        window.AndroidBridge.startPairingOrConnect();
      }
    }

    window.updateSearchStatus = function(statusMessage, resetButton) {
      document.getElementById('popup-desc').innerText = statusMessage;
      if (resetButton) {
        isSearching = false;
        document.getElementById('search-radar').classList.add('hidden');
        document.getElementById('search-radar').classList.remove('flex');
        document.getElementById('btn-spinner').classList.add('hidden');
        document.getElementById('btn-text').innerText = 'Connect';
      }
    };

    window.onDeviceConnected = function(deviceName, batteryLevel) {
      isSearching = false;
      isConnected = true;

      if (deviceName) document.getElementById('device-title').innerText = deviceName;
      if (batteryLevel >= 0 && batteryLevel <= 100) updateBattery(batteryLevel);

      document.getElementById('search-radar').classList.add('hidden');
      document.getElementById('search-radar').classList.remove('flex');
      document.getElementById('btn-spinner').classList.add('hidden');
      document.getElementById('popup-desc').classList.add('hidden');

      // Exibe a bateria agora que está conectado
      document.getElementById('popup-battery-badge').classList.remove('hidden');
      document.getElementById('popup-battery-badge').classList.add('flex');

      document.getElementById('chameleon-headphone-panel').classList.remove('hidden');
      document.getElementById('btn-text').innerText = 'Concluído';
      startAutoDismissTimer();
    };

    function closePopup() {
      cancelAutoDismiss();
      document.getElementById('view-popup').classList.add('hidden');
      if (window.AndroidBridge) window.AndroidBridge.closeOverlay();
    }

    window.updateFromAndroid = function(deviceName, batteryLevel, connected) {
      if (batteryLevel >= 0 && batteryLevel <= 100) updateBattery(batteryLevel);
      if (connected) {
        window.onDeviceConnected(deviceName, batteryLevel);
      } else if (deviceName) {
        document.getElementById('device-title').innerText = deviceName;
      }
    };

    window.onload = () => {
      const savedMode = localStorage.getItem('studio_pro_ui_mode');
      if (savedMode !== null) {
        uiModeIdx = parseInt(savedMode, 10) % UI_MODES.length;
      }
      applyUiMode(UI_MODES[uiModeIdx].id);
      document.getElementById('btn-ui-mode').innerText = UI_MODES[uiModeIdx].icon;

      const savedGlass = localStorage.getItem('studio_pro_glass_theme');
      if (savedGlass !== null) {
        themeIdx = parseInt(savedGlass, 10) % GLASS_THEMES.length;
        document.body.setAttribute('data-glass', GLASS_THEMES[themeIdx].id);
      }
    };
  </script>
</body>
</html>
